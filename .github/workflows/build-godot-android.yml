name: Build Qara Qızıl 3D Android APK

on:
  push:
    branches:
      - main
      - feature/black-gold-drop-catcher
    paths:
      - "godot-3d/**"
      - ".github/workflows/build-godot-android.yml"
  pull_request:
    branches:
      - main
    paths:
      - "godot-3d/**"
      - ".github/workflows/build-godot-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-godot-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"
          test -x "$SDK_PATH/cmdline-tools/16.0/bin/sdkmanager" || find "$SDK_PATH/cmdline-tools" -name sdkmanager -type f
          echo "Using Android SDK at $SDK_PATH"

      - name: Install Android SDK platform and build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Download Godot 4.4.1 and matching Android export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot/bin"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot/bin" -type f -name 'Godot_v4.4.1-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -o "$RUNNER_TEMP/godot/templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot/templates"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          TEMPLATE_DIR="$(find "$RUNNER_TEMP/godot/templates" -type d -name 'templates' -print -quit)"
          test -n "$TEMPLATE_DIR"
          cp "$TEMPLATE_DIR/android_debug.apk" "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          cp "$TEMPLATE_DIR/android_release.apk" "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          ls -lh "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Configure Godot Android paths and debug signing
        shell: bash
        run: |
          set -euo pipefail
          JAVA_BIN="$(readlink -f "$(command -v java)")"
          JAVA_HOME_REAL="$(dirname "$(dirname "$JAVA_BIN")")"
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v             -keystore "$HOME/.android/debug.keystore"             -storepass android             -alias androiddebugkey             -keypass android             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME_REAL"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "Java home: $JAVA_HOME_REAL"
          echo "Android SDK: $ANDROID_HOME"
          test -x "$JAVA_HOME_REAL/bin/java"
          test -s "$HOME/.android/debug.keystore"

      - name: Validate Godot project and GDScript
        run: |
          "$GODOT_BIN" --version
          "$GODOT_BIN" --headless --path godot-3d --editor --quit

      - name: Export Android debug APK
        run: |
          set -euo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --path godot-3d --export-debug "Android" build/qara-qizil-3d-debug.apk
          test -s build/qara-qizil-3d-debug.apk
          file build/qara-qizil-3d-debug.apk
          du -h build/qara-qizil-3d-debug.apk
          unzip -l build/qara-qizil-3d-debug.apk | grep -E 'AndroidManifest.xml|classes.dex|lib/arm64-v8a' | head -20

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: qara-qizil-3d-debug-apk
          path: build/qara-qizil-3d-debug.apk
          if-no-files-found: error
          retention-days: 14
